# Railway yapılandırması — https://docs.railway.com/reference/railway-toml
# Not: Dockerfile otomatik algılanır; bu dosya sağlık kontrolü + yeniden başlatma politikasını ayarlar.

[deploy]
startCommand = "node dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
